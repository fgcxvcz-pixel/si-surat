# Nginx config — SiSurat
# Salin ke: /etc/nginx/sites-available/sisurat
# Lalu: sudo ln -sf /etc/nginx/sites-available/sisurat /etc/nginx/sites-enabled/sisurat
# Edit server_name, root path, dan upload path sesuai server.

# ── Rate Limiting Zones ──────────────────────────────────────────────────────
limit_req_zone \ zone=general_limit:10m rate=10r/s;
limit_req_zone \ zone=auth_limit:10m rate=5r/m;
limit_req_zone \ zone=upload_limit:10m rate=2r/m;

# ── Gzip Compression ─────────────────────────────────────────────────────────
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
gzip_min_length 1024;
gzip_vary on;
gzip_comp_level 6;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Uncomment setelah certbot HTTPS:
    # return 301 https://\System.Management.Automation.Internal.Host.InternalHost\;

    # Upload PDF / TTD (limit sesuai validasi app: PDF 1.5MB, image 2MB)
    client_max_body_size 5m;

    root /var/www/sisurat/dist;
    index index.html;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options \"SAMEORIGIN\" always;
    add_header X-Content-Type-Options \"nosniff\" always;
    add_header X-XSS-Protection \"1; mode=block\" always;
    add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;
    add_header Permissions-Policy \"geolocation=(), microphone=(), camera=()\" always;

    # React SPA — coba file dulu, fallback index.html
    location / {
        try_files \ \/ /index.html;
    }

    # File statis build (hashed assets)
    location /assets/ {
        expires 365d;
        add_header Cache-Control \"public, immutable\";
        try_files \ =404;
    }

    # Upload folder Express (surat + TTD)
    location /uploads/ {
        alias /var/www/sisurat/uploads/;
        expires 7d;
        add_header Cache-Control \"public\";
        try_files \ =404;
    }

    # API Auth endpoints — strict rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP \;
        proxy_set_header X-Forwarded-For \;
        proxy_set_header X-Forwarded-Proto \;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API Upload endpoints — moderate rate limiting
    location /api/upload {
        limit_req zone=upload_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP \;
        proxy_set_header X-Forwarded-For \;
        proxy_set_header X-Forwarded-Proto \;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API General endpoints — general rate limiting
    location /api/ {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host \System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP \;
        proxy_set_header X-Forwarded-For \;
        proxy_set_header X-Forwarded-Proto \;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Jangan expose file sensitif
    location ~ /\. {
        deny all;
    }
}

